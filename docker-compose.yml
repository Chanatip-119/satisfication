services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: libsatisfy_laravel
    container_name: libsatisfy-laravel
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    ports:
      - "8301:9000"
    networks:
      - libsatisfy_network

  # [Check-in ฟีเจอร์ใหม่] ตัวรัน Laravel Scheduler
  # เรียก php artisan schedule:run ทุกนาที → counters:monitor
  # (Check-out อัตโนมัติ + แจ้งเตือนหัวหน้าเมื่อเคาน์เตอร์ว่าง / ต่อเวลาเกินกำหนด)
  # ใช้ image, โฟลเดอร์โค้ด และ .env ชุดเดียวกับ service laravel
  scheduler:
    image: libsatisfy_laravel
    container_name: libsatisfy-scheduler
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    command: php artisan schedule:work
    depends_on:
      - laravel
      - db
    networks:
      - libsatisfy_network

  db:
    image: mysql:8.4
    container_name: libsatisfy-db
    restart: always
    command: --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: libsatisfy
      TZ: Asia/Bangkok
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "8302:3306"
    networks:
      - libsatisfy_network          

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: libsatisfy-phpmyadmin
    restart: unless-stopped
    ports:
      - "8303:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_PORT=3306
    networks:
      - libsatisfy_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: libsatisfy-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8304:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - libsatisfy_network

networks:
  libsatisfy_network:
    driver: bridge

volumes:
  db_data: